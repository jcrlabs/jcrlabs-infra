# Almacenamiento de datos de usuario de Nextcloud sobre una carpeta del disco
# del sistema (/ = sdb2, ext4). NO requiere formatear ni particionar: solo existe
# el directorio /var/lib/nextcloud-data (creado a mano con mkdir + chown 33:33).
# PV de tipo `local` anclado al único nodo (jonathancri) con reclaimPolicy Retain:
# si ArgoCD hace prune del PVC, los datos del disco NO se borran.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nextcloud-hdd
  labels:
    app.kubernetes.io/managed-by: argocd
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data-pv
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: nextcloud
spec:
  capacity:
    # Límite lógico del claim (el disco / tiene ~575 GB libres). Ajústalo si quieres.
    storage: 400Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nextcloud-hdd
  volumeMode: Filesystem
  local:
    path: /var/lib/nextcloud-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - jonathancri
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: nextcloud
  labels:
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/name: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nextcloud-hdd
  volumeName: nextcloud-data-pv
  resources:
    requests:
      storage: 400Gi
