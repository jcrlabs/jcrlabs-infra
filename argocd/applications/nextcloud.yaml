apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio
  sources:
    # Chart oficial de Nextcloud desde el repo Helm.
    - repoURL: https://nextcloud.github.io/helm/
      chart: nextcloud
      targetRevision: 9.2.5
      helm:
        releaseName: nextcloud
        valueFiles:
          - $values/k8s/nextcloud/values-prod.yaml
    # Repo de infra solo como fuente de los values (ref $values).
    - repoURL: https://github.com/jcrlabs/jcrlabs-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
