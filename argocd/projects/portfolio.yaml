apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: portfolio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: jcrlabs portfolio projects
  sourceRepos:
    - https://github.com/jcrlabs/*
    # Chart oficial de Nextcloud (repo Helm público)
    - https://nextcloud.github.io/helm/
  destinations:
    - namespace: home
      server: https://kubernetes.default.svc
    - namespace: home-test
      server: https://kubernetes.default.svc
    - namespace: inventory
      server: https://kubernetes.default.svc
    - namespace: inventory-test
      server: https://kubernetes.default.svc
    - namespace: blog
      server: https://kubernetes.default.svc
    - namespace: blog-test
      server: https://kubernetes.default.svc
    - namespace: dashboard
      server: https://kubernetes.default.svc
    - namespace: dashboard-test
      server: https://kubernetes.default.svc
    - namespace: chat
      server: https://kubernetes.default.svc
    - namespace: chat-test
      server: https://kubernetes.default.svc
    - namespace: fincontrol
      server: https://kubernetes.default.svc
    - namespace: fincontrol-test
      server: https://kubernetes.default.svc
    - namespace: portfolio
      server: https://kubernetes.default.svc
    - namespace: portfolio-test
      server: https://kubernetes.default.svc
    - namespace: compra
      server: https://kubernetes.default.svc
    - namespace: nextcloud
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    # Nextcloud: PV local sobre el HDD dedicado + su StorageClass
    - group: ''
      kind: PersistentVolume
    - group: storage.k8s.io
      kind: StorageClass
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  orphanedResources:
    warn: true
